  # riverpod_generator: ^2.6.1
  # riverpod_lint: ^2.6.1
    # path: ../fl_build
  fl_build:
    git:
      url: https://github.com/lppcg/fl_build.git
      ref: v1.0.51

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  image_path: "assets/app_icon.png"


ffigen:
  # Name of the generated class
  name: Libgoolib
  # Description for the generated file
  description: Bindings for the golib native library.
  # Output file for the generated bindings
  output: 'lib/bridges/generated_bindings_golib.dart'
  # The C header file to parse
  headers:
    entry-points:
      - 'native/libgolib-linux-amd64.h'
  # Optional: Add a preamble to the generated file to ignore lint warnings
  preamble: |
    // ignore_for_file: unused_element, unused_field

# ...Your existing configuration...
hooks:
  user_defines:
    dartcv4:
      exclude_modules:
        - contrib
        - dnn
        - features2d
        - core
      include_modules:
        - core # core is always required thus will be ignored even configured here.
        - imgproc
        - videoio